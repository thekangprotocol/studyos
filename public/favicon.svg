<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Pitch Black Outer Circle with Smooth Rounded Border -->
  <rect width="64" height="64" rx="16" fill="#000000"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="22" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  
  <!-- North-South Needle -->
  <path d="M32 12L38 32L32 52L26 32L32 12Z" fill="#ffffff"/>
  
  <!-- Inner Center Core -->
  <circle cx="32" cy="32" r="4" fill="#000000"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>

  <!-- Compass Star Accents -->
  <circle cx="32" cy="12" r="1.5" fill="#ffffff"/>
  <circle cx="52" cy="32" r="1.5" fill="#ffffff"/>
  <circle cx="32" cy="52" r="1.5" fill="#ffffff"/>
  <circle cx="12" cy="32" r="1.5" fill="#ffffff"/>
</svg>